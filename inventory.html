<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NISHAD BRAND — ID Inventory</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top"><div class="brandIcon">▣</div><div><div class="brand">NISHAD BRAND</div><div class="sub">ID INVENTORY</div></div></header>
<main class="card admin">
  <h1>Manage IDs</h1>
  <p class="note">Yahan available Username + Password manually add karein. Password sirf authorized admin ko hi dikhna chahiye.</p>

  <div class="order">
    <label class="fieldLabel">Username</label>
    <input id="username" class="input" placeholder="Username">
    <label class="fieldLabel">Password</label>
    <input id="password" class="input" type="password" placeholder="Password">
    <button class="buy" id="add">+ Add ID</button>
  </div>

  <div id="stats" class="status">Loading…</div>
  <div id="list"></div>
</main>

<script>
async function req(url,opts={}) {
  const secret=localStorage.getItem("adminSecret")||prompt("Admin secret enter karein:");
  if(secret)localStorage.setItem("adminSecret",secret);
  opts.headers=Object.assign({"Content-Type":"application/json","x-admin-secret":secret},opts.headers||{});
  const r=await fetch(url,opts); const d=await r.json();
  if(!r.ok) throw new Error(d.error||"Request failed"); return d;
}
async function load(){
 try{
  const d=await req("/api/admin/inventory");
  document.getElementById("stats").textContent=`Available: ${d.available} | Sold: ${d.sold} | Total: ${d.total}`;
  document.getElementById("list").innerHTML=d.items.length?d.items.map(x=>`
    <div class="order">
      <b>${x.username}</b><br>
      Status: ${x.status}${x.soldOrder?`<br>Order: ${x.soldOrder}`:""}
      ${x.status==="AVAILABLE"?`<button onclick="removeId('${x.id}')" style="margin-top:8px;padding:8px 12px">Delete</button>`:""}
    </div>`).join(""):"No IDs added yet.";
 }catch(e){document.getElementById("stats").textContent=e.message; localStorage.removeItem("adminSecret");}
}
document.getElementById("add").onclick=async()=>{
 const username=document.getElementById("username").value.trim();
 const password=document.getElementById("password").value;
 if(!username||!password){alert("Username aur Password dono bharein.");return;}
 try{
  await req("/api/admin/inventory/add",{method:"POST",body:JSON.stringify({username,password})});
  document.getElementById("username").value=""; document.getElementById("password").value="";
  load();
 }catch(e){alert(e.message)}
};
async function removeId(id){
 if(!confirm("Is available ID ko delete karna hai?"))return;
 try{await req("/api/admin/inventory/delete",{method:"POST",body:JSON.stringify({id})});load();}
 catch(e){alert(e.message)}
}
load();
</script>
</body>
</html>
